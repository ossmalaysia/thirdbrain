# Code scanning. A private repository needs GitHub Advanced Security for this, so the job runs only when the
# repository is public (it is skipped, not failed, while it is private).
# Actions are pinned to full commit SHAs: the OSS Malaysia organisation requires it (Dependabot updates the pins).
name: CodeQL
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "23 4 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v3
