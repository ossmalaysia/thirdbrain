# Weekly package checks. Security updates come as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/app"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
  - package-ecosystem: "bun"
    directory: "/desktop"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
